# Render Blueprint — deploys the API, PostgreSQL, storefront and dashboard.
# Render dashboard → New → Blueprint → pick this repository.
# Secrets marked `sync: false` are entered in the Render dashboard (never in git).
databases:
  - name: iceq-sole-db
    databaseName: iceq_sole
    region: singapore
    plan: free          # free Postgres expires after 30 days - upgrade to basic-256mb for real customers

services:
  - type: web
    name: iceq-sole-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: free          # sleeps after 15 min idle; use `starter` (+ preDeployCommand) for real customers
    buildCommand: pip install -r requirements.txt
    # Free instances can't use preDeployCommand, so migrations run at start-up (safe to repeat)
    startCommand: alembic upgrade head && python create_admin.py --from-env && python seed.py --if-env && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 -b 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: iceq-sole-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # e.g. https://iceqsole.com,https://admin.iceqsole.com
      - key: STORE_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: cloudflare
      - key: SEED_DEMO_CATALOG        # loads the demo catalogue once (skipped if products exist); set false for a real launch
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Optional, add later in Render -> iceq-sole-api -> Environment:
      #   BAKONG_ACCOUNT_ID, BAKONG_API_TOKEN  (ABA / Bakong KHQR auto-verification)
      #   SMTP_HOST=smtp.gmail.com, SMTP_PORT=587, SMTP_USER, SMTP_PASSWORD (Gmail App Password),
      #   SMTP_FROM  (password-reset emails; without them reset links are not sent)
      - key: INITIAL_ADMIN_EMAIL      # first admin (no shell on free plan); remove after first login
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

  - type: web
    name: iceq-sole-store
    runtime: static
    rootDir: store
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # e.g. https://iceq-sole-api.onrender.com
    routes:
      - type: rewrite
        source: /sitemap.xml
        destination: https://iceq-sole-api.onrender.com/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY

  - type: web
    name: iceq-sole-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_STORE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
