# Render's free plan puts the API to sleep after 15 minutes without visits, and the next
# visitor waits ~50 s while it wakes. This pings the health check every 10 minutes so it
# stays awake. Free on GitHub. Note: GitHub pauses scheduled jobs after 60 days with no
# commits to the repo; re-enable it under Actions if that happens.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://iceq-sole-api.onrender.com/api/health) && echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "API did not answer with 200"; exit 1
