<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F5F4F0" />
    <script>
      // Apply saved theme + language before first paint (no flash of the wrong theme)
      (function () {
        try {
          var t = localStorage.getItem('iq_theme');
          if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark';
            document.querySelector('meta[name=theme-color]').setAttribute('content', '#0B0B0D'); }
          var l = localStorage.getItem('iq_lang');
          if (!l) l = (navigator.language || '').toLowerCase().indexOf('km') === 0 ? 'km' : 'en';
          document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
    <title>IceQ Sole · Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
