# Optional: run PostgreSQL + the API locally with Docker (production-like setup).
#   docker compose up --build
# The storefront / dashboard still run with `npm run dev` and proxy /api to :8000.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iceq_sole
      POSTGRES_USER: iceq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iceq_local_only}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceq -d iceq_sole"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://iceq:${POSTGRES_PASSWORD:-iceq_local_only}@db:5432/iceq_sole
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
