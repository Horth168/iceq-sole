    <meta name="theme-color" content="#F5F4F0" />
    <script>
      // Apply saved theme + language before first paint (prevents a flash of the wrong theme)
      (function () {
        try {
          var t = localStorage.getItem('iq_theme');
          if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark';
            document.querySelector('meta[name=theme-color]').setAttribute('content', '#0B0B0D'); }
          var l = localStorage.getItem('iq_lang');
          if (!l) l = (navigator.language || '').toLowerCase().indexOf('km') === 0 ? 'km' : 'en';
          document.documentElement.lang = l;
        } catch (e) {}
      })();
      // Inside a Telegram Mini App: load Telegram's SDK (only there), open full height and stop
      // vertical swipes from closing the app, so the page scrolls like a normal app.
      (function () {
        var inTg = /tgWebApp/.test(location.hash) || window.TelegramWebviewProxy || /Telegram/i.test(navigator.userAgent);
        if (!inTg) return;
        var s = document.createElement('script');
        s.src = 'https://telegram.org/js/telegram-web-app.js'; s.async = true;
        s.onload = function () {
          var tg = window.Telegram && window.Telegram.WebApp; if (!tg) return;
          try {
            tg.ready(); tg.expand();
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
            var c = document.documentElement.classList.contains('dark') ? '#0B0B0D' : '#F5F4F0';
            if (tg.setHeaderColor) tg.setHeaderColor(c);
            if (tg.setBackgroundColor) tg.setBackgroundColor(c);
            document.documentElement.classList.add('in-telegram');
          } catch (e) {}
        };
        document.head.appendChild(s);
      })();
    </script>
